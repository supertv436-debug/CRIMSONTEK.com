<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
    <script src="crimson-require-login.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRIMSONTEK INDUSTRIES // CAD_VIEWER (STL)</title>
  <link rel="stylesheet" href="crimson-theme.css">
  <style>
    body { margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
    header {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 0, 51, 0.35);
      background: var(--ct-bg2);
      position: relative;
      z-index: 2;
    }
    header h1 {
      margin: 0;
      font-size: 0.85rem;
      color: var(--ct-red);
      letter-spacing: 0.12em;
    }
    header p {
      margin: 8px 0 0 0;
      font-size: 0.82rem;
      color: var(--ct-text2);
      text-transform: none;
      max-width: 720px;
      line-height: 1.45;
    }
    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }
    .bar input[type="file"] { font-size: 0.78rem; color: var(--ct-text2); }
    .bar button {
      background: var(--ct-red);
      color: #050505;
      border: none;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      box-shadow: var(--ct-glow);
    }
    .bar button.secondary {
      background: transparent;
      color: var(--ct-text);
      border: 1px solid var(--ct-muted);
      box-shadow: none;
    }
    #host {
      flex: 1;
      min-height: 400px;
      position: relative;
    }
    footer {
      padding: 12px 16px;
      font-size: 0.78rem;
    }
    footer a { color: var(--ct-neon-soft); }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header>
    <h1>CAD_VIEW · ЗАГРУЗКА STL</h1>
    <p>Браузерный просмотр моделей в формате <strong>ASCII / binary STL</strong>. Перетащите файл или выберите через поле ниже. DWG/STEP — конвертируйте во внешнем ПО в STL для предпросмотра.</p>
    <div class="bar">
      <input type="file" id="file" accept=".stl,.STL">
      <button type="button" id="reset" class="secondary">СБРОС ВИДА</button>
    </div>
  </header>
  <div id="host"></div>
  <footer><a href="calc_hub.html">← CALC_HUB</a></footer>

  <script src="crimson-stats.js"></script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    if (localStorage.getItem('c_verified') !== 'true') location.href = 'operator_access.html';
    try { crimsonTrackModule('cad_viewer'); } catch (e) {}

    const host = document.getElementById('host');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080808);

    const camera = new THREE.PerspectiveCamera(50, host.clientWidth / host.clientHeight, 0.01, 500);
    camera.position.set(3.2, 2.4, 4.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(host.clientWidth, host.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    host.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xffcccc, 0x222222, 1.1));
    const dl = new THREE.DirectionalLight(0xffffff, 1);
    dl.position.set(4, 10, 6);
    scene.add(dl);

    const grid = new THREE.GridHelper(20, 40, 0x552233, 0x1a0a10);
    scene.add(grid);

    let mesh = null;
    const mat = new THREE.MeshStandardMaterial({
      color: 0xcc2244,
      metalness: 0.25,
      roughness: 0.45,
      flatShading: false
    });

    function fitCameraToObject(obj) {
      const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z, 1e-6);
      camera.near = maxDim / 100;
      camera.far = maxDim * 100;
      camera.updateProjectionMatrix();
      controls.target.copy(center);
      camera.position.copy(center).add(new THREE.Vector3(maxDim * 1.1, maxDim * 0.75, maxDim * 1.4));
      controls.update();
    }

    function loadArrayBuffer(buf) {
      if (mesh) {
        scene.remove(mesh);
        mesh.geometry.dispose();
        mesh = null;
      }
      const geo = new STLLoader().parse(buf);
      geo.computeVertexNormals();
      mesh = new THREE.Mesh(geo, mat);
      scene.add(mesh);
      fitCameraToObject(mesh);
    }

    document.getElementById('file').addEventListener('change', function (e) {
      const f = e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = function () { loadArrayBuffer(reader.result); };
      reader.readAsArrayBuffer(f);
    });

    document.getElementById('reset').onclick = function () {
      if (mesh) fitCameraToObject(mesh);
      else {
        controls.target.set(0, 0, 0);
        camera.position.set(3.2, 2.4, 4.2);
      }
    };

    function onResize() {
      const w = host.clientWidth;
      const h = host.clientHeight || 400;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', onResize);
    onResize();

    function loop() {
      requestAnimationFrame(loop);
      controls.update();
      renderer.render(scene, camera);
    }
    loop();
  </script>
</body>
</html>
