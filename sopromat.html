<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="crimson-require-login.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOPROMAT_3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background: #000; color: #ffd700; font-family: monospace; margin: 0; padding: 10px; }
        #render { width: 100%; height: 200px; border: 1px solid #333; margin-bottom: 10px; }
        .card { border: 1px solid #ffd700; padding: 10px; background: #050500; }
        #log { height: 140px; overflow-y: auto; font-size: 0.95rem; border: 1px solid #222; margin-bottom: 10px; padding: 8px; }
        input { background: #000; border: 1px solid #ffd700; color: #fff; padding: 10px; width: 65%; outline: none; }
        button { background: #ffd700; color: #000; border: none; padding: 10px; font-weight: bold; width: 30%; }
    </style>
    <link rel="stylesheet" href="crimson-theme.css">
</head>
<body>
    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
        <span>[ ENG_UNIT ]</span>
        <a href="dashboard.html" style="color:#ffd700; text-decoration:none;">[ EXIT ]</a>
    </div>
    <div id="render"></div>
    <div class="card">
        <div id="log">/ 3D_ENGINE_ACTIVE.</div>
        <div style="display:flex; justify-content:space-between;">
            <input type="text" id="q" placeholder="ЗАДАЧА...">
            <button onclick="calc()">EXE</button>
        </div>
    </div>
    <script src="crimson-config.js"></script>
    <script>
        let s, c, r, m;
        function init() {
            s = new THREE.Scene();
            c = new THREE.PerspectiveCamera(75, window.innerWidth/200, 0.1, 1000);
            r = new THREE.WebGLRenderer({antialias:true, alpha:true});
            r.setSize(window.innerWidth-20, 200);
            document.getElementById('render').appendChild(r.domElement);
            m = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshBasicMaterial({color:0xffd700, wireframe:true}));
            s.add(m); c.position.z = 5; animate();
        }
        function animate() { requestAnimationFrame(animate); m.rotation.x+=0.01; m.rotation.y+=0.01; r.render(s,c); }
        async function calc() {
            const q = document.getElementById('q'); const l = document.getElementById('log');
            const text = q.value;
            if (!text) return;
            l.innerHTML += `<div>&gt; ${escapeHtml(text)}</div>`;
            q.value = "";
            try {
                const reply = await crimsonAiChat([
                    { role: 'system', content: crimsonAiSystemPrompt('Ты ведущий инженер CRIMSONTEK по сопротивлению материалам: напряжения, балки, кручение, запасы прочности. Кратко, с формулами по запросу.') },
                    { role: 'user', content: text }
                ]);
                l.innerHTML += `<div style="color:#fff">AI: ${crimsonFormatAiHtml(reply)}</div>`;
            } catch (e) {
                if (e.code === 'NO_KEY') {
                    l.innerHTML += `<div style="color:#f00">НЕТ API-КЛЮЧА — задайте ключ на HUB или в crimson-config.js</div>`;
                } else {
                    l.innerHTML += `<div style="color:#f00">ERROR: ${escapeHtml(String(e.message || e))}</div>`;
                }
            }
            l.scrollTop = l.scrollHeight;
        }
        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }
        window.onload = init;
    </script>
</body>
</html>
